<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RC Car Controller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      font-size: 0.9rem;
      border-bottom: 1px solid #333;
    }

    #status-display {
      font-family: monospace;
      color: #00e676;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      gap: 20px;
    }

    /* Left Section: Throttle Slider */
    .slider-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #2a2a2a;
    }

    .slider-track {
      position: relative;
      width: 60px;
      height: 75%;
      background: #262626;
      border-radius: 30px;
      border: 2px solid #444;
      display: flex;
      justify-content: center;
    }

    .slider-center-mark {
      position: absolute;
      top: 50%;
      width: 100%;
      height: 2px;
      background: #666;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #2979ff;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .control-label {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Right Section: Steering Buttons */
    .buttons-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: row;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #2a2a2a;
    }

    .steer-btn {
      flex: 1;
      height: 75%;
      background: #2a2a2a;
      border: 2px solid #444;
      border-radius: 12px;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.1s, border-color 0.1s;
    }

    .steer-btn span {
      font-size: 0.85rem;
      color: #aaa;
    }

    .steer-btn.active {
      background: #00c853;
      border-color: #b9f6ca;
    }

    /* Layout adjustment for narrow vertical orientations */
    @media (max-aspect-ratio: 1/1) {
      main {
        flex-direction: column;
      }
      .slider-container, .buttons-container {
        width: 100%;
        height: 50%;
      }
      .slider-track {
        height: 60%;
      }
      .steer-btn {
        height: 80%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div>RC Dual-Drive</div>
    <div id="status-display">THROTTLE: 0% | STEER: CENTER</div>
  </header>

  <main>
    <!-- Throttle Slider (Left) -->
    <div class="slider-container" id="throttle-area">
      <div class="slider-track" id="slider-track">
        <div class="slider-center-mark"></div>
        <div class="slider-thumb" id="slider-thumb"></div>
      </div>
      <div class="control-label">Throttle (-100 to 100)</div>
    </div>

    <!-- Steering Controls (Right) -->
    <div class="buttons-container">
      <button class="steer-btn" id="btn-left">
        &larr;
        <span>LEFT</span>
      </button>
      <button class="steer-btn" id="btn-right">
        &rarr;
        <span>RIGHT</span>
      </button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
